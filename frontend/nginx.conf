# В тестовой установке готовый фронтенд не требует Node/Vite и файлового watcher.
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    # Docker DNS: перезапуск/recreate API не оставляет в proxy старый IP.
    resolver 127.0.0.11 valid=10s;
    set $tentex_api http://api:8000;

    location /api/ {
        proxy_pass $tentex_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 600s;
        client_max_body_size 25g;
        proxy_request_buffering off;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
