# Явный режим разработки; обычный docker compose up запускает готовый интерфейс.
services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  web:
    build:
      target: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      TENTEX_API_URL: http://api:8000
