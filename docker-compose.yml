# Этап 0: два сервиса, оба в режиме разработки с перезагрузкой по изменению файлов.
# Данные (SQLite и файловое хранилище) лежат в ./data на хосте — контейнер их не уносит.

services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
    environment:
      TENTEX_DATA_DIR: /data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # node_modules берём из образа: на хосте лежат бинарники под Windows.
      - /app/node_modules
    environment:
      TENTEX_API_URL: http://api:8000
    depends_on:
      - api
