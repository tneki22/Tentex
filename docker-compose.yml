# Этап 0: два сервиса, оба в режиме разработки с перезагрузкой по изменению файлов.
# Данные (SQLite и файловое хранилище) лежат в ./data на хосте — контейнер их не уносит.

services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
      # Кнопка «Запустить сервис» в разделе «Распознавание» поднимает контейнер
      # textbook-ocr сама. Без сокета кнопки не будет — экран честно скажет, что
      # управлять сервисом отсюда нельзя, и ничего не сломается.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TENTEX_DATA_DIR: /data
      TENTEX_TEXTBOOK_OCR_URL: http://textbook-ocr:8090
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./data/models:/root/.paddlex
      - ./data/models/huggingface:/root/.cache/huggingface
    environment:
      TENTEX_DATA_DIR: /data
      TENTEX_TEXTBOOK_OCR_URL: http://textbook-ocr:8090
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    depends_on:
      api:
        condition: service_healthy

  textbook-ocr:
    profiles: ["textbook"]
    build: ./ocr_service
    ports:
      - "8090:8090"
    volumes:
      - ./data/models:/root/.paddlex
      - ./data/models/huggingface:/root/.cache/huggingface
    environment:
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      CUDA_VISIBLE_DEVICES: "0"
      # Единственный профиль «Учебник»: формулы и структура страницы без тяжёлого
      # распознавания таблиц. Он рассчитан на доступные 8 ГБ видеопамяти.
      TENTEX_TEXTBOOK_EXECUTOR: formulas
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    shm_size: "2gb"
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # node_modules берём из образа: на хосте лежат бинарники под Windows.
      - /app/node_modules
    environment:
      TENTEX_API_URL: http://api:8000
    depends_on:
      - api
